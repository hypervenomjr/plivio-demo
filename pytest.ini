[pytest]
testpaths = backend/tests
filterwarnings =
    # webrtcvad 2.0.10 imports pkg_resources; setuptools is pinned <81 so it
    # still works, but it warns on every import.
    ignore:pkg_resources is deprecated:UserWarning
    # chromadb 0.5.x accesses model_fields on instances.
    ignore:Accessing the 'model_fields' attribute:DeprecationWarning
    ignore::DeprecationWarning:huggingface_hub.*
